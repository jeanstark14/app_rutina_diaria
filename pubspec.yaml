name: app_rutina_diaria
description: "A new Flutter project."
publish_to: 'none'
version: 1.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.19.0
  sqflite: ^2.3.3+2
  path: ^1.9.0
  provider: ^6.1.2
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  file_picker: ^8.0.0
  flutter_alarm_clock: ^0.1.2
  path_provider: ^2.1.3
  audioplayers: ^5.2.1
  permission_handler: ^11.0.1
  url_launcher: ^6.2.4
  http: ^1.1.0
  cached_network_image: ^3.3.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0E14"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/skins/
